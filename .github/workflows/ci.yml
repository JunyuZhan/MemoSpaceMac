name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: Kit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Release build
        run: swift build -c release

  app:
    name: App build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build .app bundle (no Xcode)
        run: make app

      - name: Verify ad-hoc signature
        run: codesign --verify --deep --strict --verbose=1 dist/MemoSpaceMac.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app with xcodebuild
        run: |
          xcodebuild \
            -project MemoSpaceMac.xcodeproj \
            -scheme MemoSpaceMac \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
