name: 功能建议
description: 提出新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认该功能不在 README 的「不做」列表中。v1 聚焦局域网 SMB 文件管理。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述使用场景与痛点
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - UI / 交互
        - SMB 传输
        - 设备发现
        - 预览 / 缓存
        - 构建 / 文档
        - 其他
    validations:
      required: true
