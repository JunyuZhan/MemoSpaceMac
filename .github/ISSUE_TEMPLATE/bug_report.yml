name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索现有 Issue，并**不要**粘贴密码、完整内网地址或设备序列号。
  - type: input
    id: macos
    attributes:
      label: macOS 版本与芯片
      placeholder: 例如 macOS 15.7.3 / Apple M2
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备型号与固件
      placeholder: 例如 华为家庭存储 2TB / 固件版本（如已知）
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 App
        2. 输入 IP …
        3. 点击 …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 如有报错，请粘贴错误文案（隐去敏感信息）
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 附加信息
      description: 可粘贴 `smbutil statshares -a` 的 SMB 版本相关输出（隐去 IP 与账号）
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，未找到相同问题
          required: true
        - label: 我确认内容中不含密码或敏感信息
          required: true
